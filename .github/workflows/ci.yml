# CI của plugin GameKit: test CLI trên 3 hệ điều hành, và một lượt đầu-cuối trên Linux
# (tạo game từ template, npm install thật, test/typecheck/lint, smoke trong Chromium, pack).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e (template game + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # The game's playwright-core is installed later by `gamekit init`; smoke finds any cached chromium revision.
      - run: npx -y playwright-core@1 install --with-deps chromium
      - run: npm test
        env:
          GK_E2E: '1'
