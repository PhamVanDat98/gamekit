# Trạng thái game trong GameKit. Script đọc và ghi file này; sửa tay được, giữ đúng schema.
name: {{NAME}}
title: {{TITLE}}            # tên hiển thị trên web
version: 0.1.0
phase: P0
source:
  ownership: own            # own: game của bạn (giữ hình, âm thanh, tên) · third-party: làm lại game người khác (bắt buộc reskin)
  engine: {{ENGINE}}
  engineVersion: null
  path: null                # đường dẫn local tới game gốc (không bao giờ đóng gói)
  notes: null
runtime:
  kind: 2d
  renderer: canvas
  physics: none
  fixedStepHz: 60
portals:
  - dev-mock
portalSettings: {}           # thông tin từng portal — gamekit config --portal <id>
language: en                 # ngôn ngữ mặc định cho người chơi mới
languages:                   # mỗi mã một file Language/<mã>.json; en bắt buộc
  - en
pilot: false
budget:
  initialLoadMB: 10
  timeToPlaySec: 5
  minFpsDesktop: 60
  minFpsMobile: 30
  plannedDays: {}
release:
  forbiddenTerms: []        # tên, thương hiệu game gốc — release-check chặn nếu còn trong gói
  allowedHosts: []          # host ngoài được phép (CDN SDK của portal)
gates: {}
timings:
  P0:
    start: {{CREATED}}
    end: null
