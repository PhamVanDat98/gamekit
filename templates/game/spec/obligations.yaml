# Nghĩa vụ parity: mỗi hành vi của game gốc mà bản web phải tái hiện (skill parity-check).
# Đóng bằng test gắn thẻ [id:case] trong tên, vd it('[player.move:edge] …'). `gamekit parity` chấm.
# Case: normal | edge | invalid | oracle (bảng spec/oracles) | replay | outcome (kết quả qua nhiều seed).
# fidelity (mặc định exact): exact | close (cần tolerance) | outcome (cần case outcome) | feel (D-n + approved, không test số).
# Không làm một nghĩa vụ: status blocked|out-of-scope + decision D-n + approved (người dùng duyệt).
# Lập ở cuối P1 từ ghi chú RE: mỗi nghĩa vụ có source trỏ tới notes/… (cổng P1 kiểm tra). P2 đóng chúng bằng test.
# Nội dung sinh từ seed (level, rơi đồ) cần thêm nghĩa vụ RNG, vd:
#   - id: rng.sequence
#     title: Cùng seed cho ra đúng chuỗi số như System.Random của game gốc
#     cases: [oracle]
#     oracle: spec/oracles/rng.json     # dump từ game gốc (skill parity-check, references/oracle-harness.md)
#     source: notes/rng.md
# Các mục dưới đây là của game demo trong template — thay bằng cơ chế của game gốc.
obligations:
  - id: player.move
    title: Người chơi đi ngang player.speed px/s và không ra khỏi sân
    cases: [normal, edge]
    params: [player.speed, player.size]
  - id: obstacle.speed
    title: Chướng ngại rơi với tốc độ speedStart, tăng speedPerSecond mỗi giây
    cases: [normal, oracle]
    params: [obstacle.speedStart, obstacle.speedPerSecond]
    oracle: spec/oracles/obstacle-speed.json
  - id: obstacle.spawn
    title: Mỗi spawnEvery giây sinh một chướng ngại
    cases: [normal]
    params: [obstacle.spawnEvery]
  - id: score.rate
    title: Cộng score.perSecond điểm mỗi giây
    cases: [normal]
    params: [score.perSecond]
  - id: rules.collision
    title: Va chạm thì thua và thế giới ngừng cập nhật
    cases: [normal]
  - id: run.replay
    title: Cùng seed và input ghi lại cho ra đúng trạng thái cuối
    cases: [replay]
